<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endless Offline Theater</title>
  <link rel="stylesheet" href="/static/css/index.css?v=5">
  <link rel="stylesheet" href="/static/app-exit.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23f4f1ea'/><polygon points='26,18 47,32 26,46' fill='%23151412'/></svg>">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="/" title="Endless Offline Theater">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <span>Theater</span>
      </a>
      <div class="mode-switch" id="modeSwitch" aria-label="Experience Mode"></div>
      <div class="header-actions">
        <button class="icon-button" id="btnOpenSettings" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Zm8.7-4.5-2-.6a7 7 0 0 0-.7-1.7l1-1.8-1.9-1.9-1.8 1a7 7 0 0 0-1.7-.7l-.6-2h-2l-.6 2a7 7 0 0 0-1.7.7L6.9 5 5 6.9l1 1.8a7 7 0 0 0-.7 1.7l-2 .6v2l2 .6a7 7 0 0 0 .7 1.7l-1 1.8L6.9 19l1.8-1a7 7 0 0 0 1.7.7l.6 2h2l.6-2a7 7 0 0 0 1.7-.7l1.8 1 1.9-1.9-1-1.8a7 7 0 0 0 .7-1.7l2-.6v-2Z"/></svg>
        </button>
      </div>
    </header>

    <main class="workspace">
      <section class="stage-column">
        <div class="player-shell" id="playerShell">
          <video id="player" playsinline preload="auto"></video>
          <div class="caption-window" id="captionWindow" aria-live="off" hidden>
            <div class="caption-scroll" id="captionText"></div>
            <div class="learning-interlude" id="learningInterlude" role="status" aria-live="polite" aria-atomic="true" hidden>
              <div class="learning-pair" id="learningPair">
                <strong id="learningSource"></strong>
                <strong id="learningTranslation"></strong>
              </div>
              <small id="learningMeta"></small>
            </div>
          </div>
          <div class="player-controls">
            <button class="player-button" id="btnPlayPause" type="button" title="Play/Pause" aria-label="Play/Pause">
              <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14Zm8-14v14h4V5h-4Z"/></svg>
            </button>
            <button class="player-button" id="btnNextScene" type="button" title="Next Scene" aria-label="Next Scene">
              <svg viewBox="0 0 24 24"><path d="m6 18 8.5-6L6 6v12Zm10-12v12h2V6h-2Z"/></svg>
            </button>
            <button class="player-button" id="btnMute" type="button" title="Mute/Unmute" aria-label="Mute/Unmute">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3Zm11-1v8a4.5 4.5 0 0 0 0-8Zm0-4.8v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6Z"/></svg>
            </button>
            <span class="time" id="timeDisplay">0:00 / 0:00</span>
            <input class="scrubber" id="scrubber" type="range" min="0" max="1000" value="0" aria-label="Scene position">
            <span class="status" id="statusBadge">IDLE</span>
            <button class="player-button active" id="btnCc" type="button" title="Subtitles/closed captions (c)" aria-label="Subtitles/closed captions">CC</button>
            <button class="player-button" id="btnFullscreen" type="button" title="Full screen (f)" aria-label="Full screen">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3Zm-2-4h2V7h3V5H5v5Zm12 7h-3v2h5v-5h-2v3ZM14 5v2h3v3h2V5h-5Z"/></svg>
            </button>
          </div>
        </div>

        <form class="composer" id="storyForm">
          <textarea id="promptInput" rows="1" maxlength="1200" placeholder="Story…" required></textarea>
          <textarea id="storyTextInput" class="book-input" rows="8" placeholder="My story" hidden></textarea>
          <div class="language-pair" aria-label="Narration and translation languages">
            <label class="flag-picker" id="quickLanguagePicker" title="Narration language">
              <svg class="flag-icon" id="quickLanguageFlag" viewBox="0 0 60 40" aria-hidden="true"><use href="/static/flags.svg#flag-en"></use></svg>
              <select class="flag-select" id="quickLanguageSelect" aria-label="Narration language"></select>
            </label>
            <button class="swap-languages" id="btnSwapLanguages" type="button" aria-label="Swap languages" title="Swap languages">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 3-3H4v6l3-3Zm10 10-3 3h6v-6l-3 3ZM6.4 14.5A7 7 0 0 0 18.7 8h-2.2A5 5 0 0 1 8 13l-1.6 1.5Zm11.2-5A7 7 0 0 0 5.3 16h2.2A5 5 0 0 1 16 11l1.6-1.5Z"/></svg>
            </button>
            <label class="flag-picker" id="quickTranslationPicker" title="Translation language">
              <svg class="flag-icon" id="quickTranslationFlag" viewBox="0 0 60 40" aria-hidden="true"><use href="/static/flags.svg#flag-fi"></use></svg>
              <select class="flag-select" id="quickTranslationSelect" aria-label="Translation language"></select>
            </label>
          </div>
          <button class="start-button" id="btnStart" type="submit" title="Prompt Story" aria-label="Prompt Story">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
        </form>

        <div class="now-playing">
          <div>
            <span id="sceneNumber">No active scene</span>
            <h1 id="sceneTitle">Endless Offline Theater</h1>
          </div>
          <button class="quiet-button danger" id="btnStop" type="button" disabled title="Stop and keep archive">
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
            <span>Stop Stream</span>
          </button>
        </div>
      </section>

      <aside class="side-panel">
        <div class="side-tabs">
          <button class="active" data-tab="scenes" type="button">All Scenes</button>
          <button data-tab="direct" type="button">Live Chat / Direct</button>
          <button data-tab="saved" type="button">Saved Streams</button>
        </div>
        <div class="side-body" id="sideBody"></div>
      </aside>
    </main>
  </div>

  <div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-card">
      <div class="settings-header">
        <h2 id="settingsTitle">Stream & Story Settings</h2>
        <button class="icon-button" id="btnCloseSettings" type="button" aria-label="Close">×</button>
      </div>
      <div class="settings-grid">
        <label>Audience Level<select id="audienceSelect"></select></label>
        <label>Narration Language<select id="languageSelect"></select></label>
        <label>Neural Voice<select id="voiceSelect"></select></label>
        <label>Language-Learning Translation<select id="translationSelect"></select></label>
      </div>
      <div class="voice-preview">
        <button class="quiet-button" id="btnPreviewVoice" type="button">Hear Voice</button>
        <audio id="voicePreview" controls hidden></audio>
      </div>
      <details>
        <summary>Advanced Quality (Cinema Default: 480×272 · 16 FPS)</summary>
        <div class="quality-grid">
          <label>Width<input id="qualityWidth" type="number" min="192" max="832" step="16" value="480"></label>
          <label>Height<input id="qualityHeight" type="number" min="192" max="832" step="16" value="272"></label>
          <label>Frames<input id="qualityFrames" type="number" min="9" max="81" step="4" value="81"></label>
          <label>FPS<input id="qualityFps" type="number" min="1" max="60" value="16"></label>
          <label>Min Words<input id="minWords" type="number" min="30" max="1200" step="10" value="80"></label>
          <label>Max Words<input id="maxWords" type="number" min="30" max="2400" step="10" value="110"></label>
          <label>Max Slow<input id="maxSlow" type="number" min="1" max="20" step="0.5" value="8"></label>
          <label>Compaction Interval<input id="compactionScenes" type="number" min="0" max="200" step="5" value="30"></label>
          <label class="wide">World Seed (-1 random)<input id="seedInput" type="number" min="-1" value="-1"></label>
        </div>
      </details>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/static/app-exit.js" defer></script>
  <script src="/static/js/highlight.js?v=5"></script>
  <script src="/static/js/interlude.js?v=5"></script>
  <script src="/static/js/theater.js?v=5"></script>
</body>
</html>
